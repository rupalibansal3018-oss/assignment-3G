<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fruits Array Manager</title>
</head>
<body>
  <header>
    <h1>Fruits Array Manager</h1>
    <p>Managing a list of fruits using JavaScript <strong>Arrays</strong> and <strong>Array Methods</strong> (<code>push()</code> &amp; <code>pop()</code>).</p>
  </header>

  <hr />

  <section>
    <h2>Interactive Array Actions</h2>
    <p>
      <label for="fruitInput"><strong>Add a Fruit (using <code>push()</code>):</strong></label><br />
      <input type="text" id="fruitInput" placeholder="e.g. Pineapple" />
      <button type="button" id="pushBtn">Add Fruit (push)</button>
    </p>

    <p>
      <button type="button" id="popBtn">Remove Last Fruit (pop)</button>
      <button type="button" id="resetBtn">Reset to Initial 5 Fruits</button>
    </p>
  </section>

  <hr />

  <section id="output">
    <h2>Loading Fruits List...</h2>
  </section>

  <script src="./script.js"></script>
</body>
</html>
